name: netflix_pipeline

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BUCKET: artifact.repository63
  ARTIFACT_NAME: app-${{ github.run_number }}.war

jobs:

  build:
    runs-on: [self-hosted, githubs_actions]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven
        run: |
          sudo yum install -y maven || sudo apt-get update && sudo apt-get install -y maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and Test
        run: mvn clean package

      - name: Upload to S3
        run: |
          aws s3 cp target/*.war s3://$S3_BUCKET/$ARTIFACT_NAME


  deploy-dev:
    runs-on: [self-hosted, dev]
    needs: build

    steps:
      - name: Install Tomcat (if not installed)
        run: |
          sudo yum install -y tomcat || sudo apt-get install -y tomcat9 || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Download artifact from S3
        run: |
          aws s3 cp s3://$S3_BUCKET/$ARTIFACT_NAME app.war

      - name: Deploy to Tomcat
        run: |
          sudo cp app.war /usr/share/tomcat/webapps/ || sudo cp app.war /var/lib/tomcat9/webapps/

      - name: Start Tomcat
        run: |
          sudo systemctl enable tomcat || sudo systemctl enable tomcat9
          sudo systemctl restart tomcat || sudo systemctl restart tomcat9



  deploy-test:
    runs-on: [self-hosted, test]
    needs: deploy-dev

    steps:
      - name: Install Tomcat (if not installed)
        run: |
          sudo yum install -y tomcat || sudo apt-get install -y tomcat9 || true

      - name: Configure Tomcat users
        run: |
          sudo bash -c 'cat <<EOF > /usr/share/tomcat/conf/tomcat-users.xml
            <tomcat-users>
              <role rolename="manager-gui"/>
              <role rolename="admin-gui"/>
              <user username="admin" password="admin123" roles="manager-gui,admin-gui"/>
            </tomcat-users>  EOF'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Download artifact from S3
        run: |
          aws s3 cp s3://$S3_BUCKET/$ARTIFACT_NAME app.war

      - name: Deploy to Tomcat
        run: |
          sudo cp app.war /usr/share/tomcat/webapps/ || sudo cp app.war /var/lib/tomcat9/webapps/

      - name: Restart Tomcat
        run: |
          sudo systemctl enable tomcat || sudo systemctl enable tomcat9
          sudo systemctl restart tomcat || sudo systemctl restart tomcat9
